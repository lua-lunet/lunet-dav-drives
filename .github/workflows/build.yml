name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# publish-release needs to create the GitHub release (contents: write).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: brew install luajit luarocks libsodium

      # Rock versions are pinned to the toolchain the repo is verified
      # against: an unpinned `install tested` picked up 0.5.0, whose API
      # broke the unit smoke (tested.test removed).
      - name: Install Lua tooling tree
        run: |
          luarocks --lua-version=5.1 --tree .tools/rocks install tl 0.24.8-1 \
            && luarocks --lua-version=5.1 --tree .tools/rocks install cyan 0.4.1-1 \
            && luarocks --lua-version=5.1 --tree .tools/rocks install tested 0.3.0-1

      - name: Fetch lunet runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: luajit lunet_fetch_release_v0.18.2.lua

      - name: Build
        run: make build

      - name: Unit smoke
        run: make unit

      # The shippable unit of this repo is the Cyan-compiled Lua tree plus
      # the schema, the OpenAPI contracts, and the Hurl proofs. The lunet
      # runtime itself is fetched per project via lunet_fetch_release.
      - name: Package app archive
        run: |
          tar -czf lunet-dav-drives-app.tar.gz \
            build sql openapi.yaml openapi spec specs AGENTS.md README.md

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: lunet-dav-drives-app.tar.gz
          if-no-files-found: error

  # Same tag-publish approach as upstream lua-lunet/lunet: the build job
  # gates, and the release job only runs for v* tag pushes.
  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download app archive
        uses: actions/download-artifact@v4
        with:
          name: release-app
          path: release-assets

      - name: Name the archive for the tag
        run: |
          mv release-assets/lunet-dav-drives-app.tar.gz \
            "release-assets/lunet-dav-drives-${GITHUB_REF_NAME}.tar.gz"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/lunet-dav-drives-${{ github.ref_name }}.tar.gz
