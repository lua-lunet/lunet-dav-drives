# Ports are deliberately distinct from other lunet-dav stacks that may already
# be running on a developer machine. Keep them in step with e2e/e2e.env.
name: lunet-dav-drives-e2e

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lunet_dav_drives
    ports:
      - "127.0.0.1:55442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lunet_dav_drives"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19010:9000"
      - "127.0.0.1:19011:9001"
    tmpfs:
      - /data:size=512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    # command must be a single argument so `sh -c` receives one script rather
    # than a script plus positional arguments.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set e2e http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing e2e/lunet-dav-drives
        mc version enable e2e/lunet-dav-drives
