# Ports are deliberately distinct from other lunet-dav stacks that may already
# be running on a developer machine. Keep them in step with e2e/e2e.env.
name: lunet-dav-drives-e2e

# WHY GARAGE: MinIO delisted community binaries/images (dl.min.io 410,
# minio/minio image pulled from Docker Hub in 2025; the quay.io org is
# locked). Garage is the rust S3-compatible stand-in with the same sigv4
# API our client uses.
#
# e2e credentials ONLY (never production). The s3init one-shot bootstraps
# layout + bucket + key via the Garage admin API (idempotent) and writes
# the generated key to the s3creds volume; run-e2e.sh reads it from there.
#
# CAVEAT: Garage implements versioning but not S3 Object Lock — this stack
# exercises the put/get/delete flows end to end, but WORM behaviour
# (delete-refusal, GOVERNANCE retention, bypass-governance) can only be
# verified against the real Scaleway nl-ams bucket.
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lunet_dav_drives
    ports:
      - "127.0.0.1:55442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lunet_dav_drives"]
      interval: 1s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v2.0.0
    entrypoint: /garage
    command: ["-c", "/garage.toml", "server"]
    environment:
      GARAGE_CONFIG_FILE: "/garage.toml"
    ports:
      - "127.0.0.1:19010:3900"
      - "127.0.0.1:19011:3903"
    volumes:
      - ./garage.toml:/garage.toml
      - s3data:/var/lib/garage
    # No in-container healthcheck: the image ships no shell. s3init polls
    # the admin API itself (bootstrap.py wait_reachable).

  s3init:
    image: python:3.13-alpine
    command: ["python", "/src/bootstrap.py"]
    environment:
      ADMIN_URL: "http://garage:3903"
      BUCKET: "lunet-dav-drives"
      KEY_NAME: "lunet-e2e"
    volumes:
      - ./bootstrap.py:/src/bootstrap.py:ro
      - s3creds:/creds
    depends_on:
      - garage

volumes:
  s3data:
  s3creds:
